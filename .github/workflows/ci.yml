name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22", "24"]

    steps:
      - uses: actions/checkout@v7
      # standalone: pnpm 11 needs Node >= 22.13, but the matrix runtime must
      # stay at the tested Node version, so pnpm brings its own.
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
